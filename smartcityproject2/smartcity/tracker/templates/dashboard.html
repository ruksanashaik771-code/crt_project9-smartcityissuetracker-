<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>dashboard</title>
</head>
<body>
{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">
    Welcome, {{ user.username }}
</h2>

<div class="row">

    <div class="col-md-3">
        <div class="card text-center shadow">
            <div class="card-body">
                <h5>Total Issues</h5>
                <h2>{{ total }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center shadow">
            <div class="card-body">
                <h5>Pending</h5>
                <h2>{{ pending }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center shadow">
            <div class="card-body">
                <h5>In Progress</h5>
                <h2>{{ progress }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-center shadow">
            <div class="card-body">
                <h5>Resolved</h5>
                <h2>{{ resolved }}</h2>
            </div>
        </div>
    </div>

</div>

<div class="mt-5">

    <a href="{% url 'report' %}"
       class="btn btn-primary">

        Report New Issue

    </a>

    <a href="{% url 'my_issues' %}"
       class="btn btn-success">

        View My Issues

    </a>

</div>

{% endblock %}

</body>
</html>
