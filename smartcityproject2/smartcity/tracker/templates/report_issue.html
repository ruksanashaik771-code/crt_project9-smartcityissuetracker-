<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>report issue</title>
</head>
<body>
{% extends 'base.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-body">

        <h2 class="mb-4">
            Report New Issue
        </h2>

        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="btn btn-primary">

                Submit Issue

            </button>

        </form>

    </div>

</div>

{% endblock %}

</body>
</html>
